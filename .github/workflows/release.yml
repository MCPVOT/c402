name: release

# Publishes the package when a GitHub release is published, or on demand for an
# existing tag. Needs one repository secret: NPM_TOKEN (an npm automation token
# with publish rights for c402-protocol).
#
# A release is a decision, so this does not run on every push. It refuses a tag
# that does not match package.json, so a mis-tagged release fails loudly instead
# of shipping the wrong version.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (for example v2.2.0)
        required: true
        type: string

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # A release event checks out its tag. A manual dispatch checks out main;
      # the tag input is only compared, never used as a ref, so it cannot point
      # the job at an arbitrary tree.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || 'main' }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG package=$PKG"
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag must look like v1.2.3"; exit 1 ;;
          esac
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Install and gate
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build

      - name: Rust vector
        working-directory: rust/c402-verify
        run: cargo test

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
