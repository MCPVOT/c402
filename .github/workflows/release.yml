name: release

# Publishes c402-protocol on npm.
#
# No token is stored. Authentication is npm Trusted Publishing over OIDC: the
# job mints a short-lived, workflow-specific token that cannot be extracted or
# reused. That is strictly better than a long-lived NPM_TOKEN secret, which is
# readable by anyone who can run a workflow on this repository.
#
# One-time setup (see docs/RELEASING.md):
#   1. the package must exist on npmjs.com (first publish is done by a human);
#   2. npmjs.com -> c402-protocol -> Settings -> Trusted Publisher:
#      GitHub Actions, user MCPVOT, repository c402, workflow release.yml;
#   3. optionally create a GitHub environment `npm-publish` with required
#      reviewers, then uncomment the `environment:` line below.
#
# Requires npm >= 11.5.1 for OIDC, hence Node 24 (the guard below fails loudly
# rather than silently falling back to token auth).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (for example v2.2.0)
        required: true
        type: string

permissions:
  contents: read
  id-token: write # OIDC for Trusted Publishing + provenance

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # environment: npm-publish   # enable after creating it with required reviewers
    steps:
      # A release event checks out its tag. A manual dispatch checks out main;
      # the tag input is only compared, never used as a ref, so it cannot point
      # the job at an arbitrary tree.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || 'main' }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Require npm that supports Trusted Publishing
        run: |
          V=$(npm --version)
          echo "npm $V"
          MAJ=${V%%.*}
          REST=${V#*.}
          MIN=${REST%%.*}
          if [ "$MAJ" -lt 11 ] || { [ "$MAJ" -eq 11 ] && [ "$MIN" -lt 5 ]; }; then
            echo "::error::npm $V is older than 11.5.1; Trusted Publishing would not work"
            exit 1
          fi

      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG package=$PKG"
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag must look like v1.2.3"; exit 1 ;;
          esac
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Install and gate
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build

      - name: Rust vector
        working-directory: rust/c402-verify
        run: cargo test

      - name: Publish with OIDC (no token)
        run: npm publish --provenance --access public
